global:
  scrape_interval: 2s

scrape_configs:
  - job_name: "store-api"
    static_configs:
      - targets: ["app:8050"]

  - job_name: "store-grpc"
    static_configs:
      - targets: ["grpc-server:9101"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

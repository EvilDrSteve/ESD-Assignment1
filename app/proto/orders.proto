// Order service for the online store (ESD Assignment 2 Part B; GetProduct added in A3).
//
// Each replica also serves the standard grpc.health.v1.Health service
// (grpcio-health-checking), which Envoy uses for active health checks.
//
// Generate Python code (run from the app/ directory):
//   python -m grpc_tools.protoc -I proto --python_out=gen --pyi_out=gen --grpc_python_out=gen proto/orders.proto

syntax = "proto3";

package store.v1;

import "google/protobuf/timestamp.proto";

service OrderService {
  // Turn a cart into a pending order. Same rules and data as HTTP POST /orders.
  //
  // Errors (status code -> meaning, the trailing metadata "error-type" holds
  // the same value as the HTTP problem "type"):
  //   INVALID_ARGUMENT    bad cart_id / idempotency_key, or key reused for another cart
  //   NOT_FOUND           a product in the cart no longer exists
  //   FAILED_PRECONDITION cart empty, or not enough stock
  //   ABORTED             a request with the same idempotency_key is still running
  //   UNAVAILABLE         the store (Redis) is unreachable
  //   DEADLINE_EXCEEDED   the client's deadline passed
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);

  // Read one product (A3). Read-only and not rate limited, so it is the gRPC
  // call used for load tests; same data as HTTP GET /products/{product_id}.
  //   NOT_FOUND    no product with that id
  //   UNAVAILABLE  the store (Redis) is unreachable
  rpc GetProduct(GetProductRequest) returns (Product);
}

message GetProductRequest {
  string product_id = 1;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  double price = 5;
  int32 stock = 6;
}

message PlaceOrderRequest {
  string cart_id = 1;
  // Optional. Retrying with the same key never creates a second order.
  string idempotency_key = 2;
}

message PlaceOrderResponse {
  Order order = 1;
  // True when the order was created by an earlier call with the same key.
  bool replayed = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  SHIPPED = 3;
  DELIVERED = 4;
  CANCELLED = 5;
}

message OrderItem {
  string product_id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
  double subtotal = 5;
}

message Order {
  string id = 1;
  string cart_id = 2;
  repeated OrderItem items = 3;
  double total = 4;
  OrderStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

# Fixed project name: replica containers are always assignment-1-app-1/2/3,
# whatever the folder is called (Envoy and Prometheus address them by name).
name: assignment-1

services:

  # ── Application ────────────────────────────────────────────────────────────
  # Source of truth shared by all replicas. No volume: data is demo data and
  # is reseeded on start.
  redis:
    image: redis:7.4-alpine
    container_name: store-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Three replicas (A3): containers assignment-1-app-1/2/3 = replicas A/B/C.
  # Each serves HTTP :8050 (+ /metrics) and gRPC :50051 in one process.
  # No container_name and no host ports: they would clash between copies, and
  # clients reach the replicas through Envoy.
  app:
    build: ./app
    deploy:
      replicas: 3
    expose:
      - "8050"     # HTTP + /metrics
      - "50051"    # gRPC
    restart: unless-stopped
    environment:
      - SERVICE_NAME=store
      - REDIS_URL=redis://redis:6379/0
      - FAULT_INJECTION=false
      - ENABLE_FAULT_ADMIN=true        # POST /admin/faults for the reliability demo
      - ORDERS_RATE_LIMIT=5            # POST /orders: 5 calls ...
      - ORDERS_RATE_WINDOW_S=10        # ... per 10 s per client IP
      - GRPC_PORT=50051
      - LOG_DIR=/var/log/app
      - LOG_FILE=app-{replica}.log     # app-A.log, app-B.log, app-C.log
    volumes:
      - app_logs:/var/log/app
    depends_on:
      redis:
        condition: service_healthy

  # Load balancer (A3): the only way in from the host. Same host ports as A2,
  # so every A2 client and script now goes through Envoy unchanged.
  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: envoy
    ports:
      - "8050:8050"     # HTTP listener
      - "50051:50051"   # gRPC listener
      - "9901:9901"     # admin, /stats/prometheus
    environment:
      - ENVOY_UID=0     # run as root so it can write to the shared log volume
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - envoy_logs:/var/log/envoy
    depends_on:
      - app
    restart: unless-stopped

  # ── Metrics stack ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource and dashboards are provisioned from files, so they survive volume wipes
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"

  # ── Logging stack (Part C) ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  es-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es-init
    depends_on:
      - elasticsearch
    restart: "no"
    entrypoint: []
    command: sh /init-template.sh
    volumes:
      - ./elasticsearch/init-template.sh:/init-template.sh:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: filebeat
    user: root
    entrypoint: []
    command: >
      sh -c 'cp /tmp/filebeat.yml /usr/share/filebeat/filebeat.yml &&
             chown root:root /usr/share/filebeat/filebeat.yml &&
             chmod go-w /usr/share/filebeat/filebeat.yml &&
             exec filebeat -e'
    volumes:
      - ./filebeat/filebeat.yml:/tmp/filebeat.yml:ro
      - app_logs:/var/log/app:ro
      - envoy_logs:/var/log/envoy:ro      # Envoy access log (A3)
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - es-init

volumes:
  prometheus_data:
  grafana_data:
  es_data:
  filebeat_data:
  app_logs:
  envoy_logs:

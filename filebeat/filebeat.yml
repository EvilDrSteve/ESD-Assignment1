filebeat.inputs:
  # Replica logs: one file per replica (app-A.log, ...), HTTP and gRPC lines
  - type: log
    enabled: true
    paths:
      - /var/log/app/app-*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    fields: { log_source: app }
    fields_under_root: true

  # Envoy access log (A3): one line per proxied request / gRPC call. It shares
  # request_id and replica with the replica's own line, so one search for a
  # request_id returns both.
  - type: log
    enabled: true
    paths:
      - /var/log/envoy/access.log
    json.keys_under_root: true
    json.overwrite_keys: true
    fields: { log_source: envoy }
    fields_under_root: true

processors:
  - drop_fields:
      fields:
        - agent
        - ecs
        - host
        - input
        - log
        - taskName
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "store-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.enabled: false
